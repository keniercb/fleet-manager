# ========================================
# Fleet Management - Configuracion de la aplicacion
# ========================================

# Perfil activo
spring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=fleet-management

# ========================================
# Servidor
# ========================================
server.port=8080

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# FX-29: ShedLock
# ========================================
# La tabla 'shedlock' debe existir en la BD. DDL (PostgreSQL):
# CREATE TABLE shedlock (
#     name       VARCHAR(64)  NOT NULL PRIMARY KEY,
#     lock_until TIMESTAMP    NOT NULL,
#     locked_at  TIMESTAMP    NOT NULL,
#     locked_by  VARCHAR(255) NOT NULL
# );
# Hibernate no la crea automáticamente (no es entidad JPA). Crear manualmente
# o vía Flyway/Liquibase.

# ========================================
# Logging
# ========================================
logging.level.com.fleet.management=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# JWT
# ========================================
# FX-07: JWT secret externalizado a variable de entorno. En dev se usa un valor por defecto
# debil pero explicito; en prod (perfil "prod") la variable JWT_SECRET debe estar definida.
jwt.secret=${JWT_SECRET:dev-secret-DO-NOT-USE-IN-PROD-5A7B3C9D2E1F4A6B8C0D3E5F7A9B1C3D}
jwt.expiration=86400000
# FX-32: audiencia esperada en el token JWT (para validar)
jwt.audience=fleet-management-web

# ========================================
# Security - Rate Limiting
# ========================================
fleet.security.rate-limit.max-attempts=5
fleet.security.rate-limit.window-seconds=60
# FX-20: confiar en X-Forwarded-For (solo true si detras de reverse proxy conocido)
fleet.security.rate-limit.trust-forwarded-for=false

# ========================================
# Subscription / Onboarding
# ========================================
# FX-07: Password del admin inicial externalizada. En dev se usa valor por defecto;
# en prod la variable FLEET_DEFAULT_ADMIN_PASSWORD debe estar definida.
fleet.subscription.default-admin-password=${FLEET_DEFAULT_ADMIN_PASSWORD:FleetAdmin2026#}

# ========================================
# Reportes - Mantenimiento
# ========================================
# Umbral en km para considerar mantenimiento vencido (default: 10000)
fleet.reporte.mantenimiento.umbral-km=10000
# Porcentaje del umbral para estado PROXIMO (default: 80)
fleet.reporte.mantenimiento.porcentaje-proximo=80

# ========================================
# Enzona QR Payment Gateway
# ========================================
enzona.client-id=${ENZONA_CLIENT_ID:}
enzona.client-secret=${ENZONA_CLIENT_SECRET:}
enzona.merchant-uuid=${ENZONA_MERCHANT_UUID:}
enzona.base-url=https://api.enzona.net
enzona.token-url=https://api.enzona.net/token
enzona.qr-base-path=/qr/v1.0.0
enzona.currency=CUP
enzona.qr-timeout-hours=24
enzona.notify-url=${ENZONA_NOTIFY_URL:}
enzona.return-url=${ENZONA_RETURN_URL:}
# FX-03: Seguridad del webhook
# Lista de IPs separadas por coma (vacío = deshabilitado, solo dev)
enzona.allowed-ips=${ENZONA_ALLOWED_IPS:}
# Secreto compartido para HMAC-SHA256 del webhook (vacío = deshabilitado, solo dev)
enzona.webhook-secret=${ENZONA_WEBHOOK_SECRET:}
# Confiar en X-Forwarded-For (false por defecto para evitar bypass)
enzona.trust-forwarded-for=${ENZONA_TRUST_FORWARDED:false}