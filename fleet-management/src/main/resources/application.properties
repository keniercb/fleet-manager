# ========================================
# Fleet Management - Configuracion de la aplicacion
# ========================================

# Perfil activo
spring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=fleet-management

# ========================================
# Servidor
# ========================================
server.port=8080

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# Logging
# ========================================
logging.level.com.fleet.management=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# JWT
# ========================================
jwt.secret=5A7B3C9D2E1F4A6B8C0D3E5F7A9B1C3D5E7F9A1B3C5D7E9F1A3B5C7D9E1F3A5B
jwt.expiration=86400000

# ========================================
# Security - Rate Limiting
# ========================================
fleet.security.rate-limit.max-attempts=5
fleet.security.rate-limit.window-seconds=60

# ========================================
# Subscription / Onboarding
# ========================================
fleet.subscription.default-admin-password=FleetAdmin2026#

# ========================================
# Reportes - Mantenimiento
# ========================================
# Umbral en km para considerar mantenimiento vencido (default: 10000)
fleet.reporte.mantenimiento.umbral-km=10000
# Porcentaje del umbral para estado PROXIMO (default: 80)
fleet.reporte.mantenimiento.porcentaje-proximo=80

# ========================================
# Enzona QR Payment Gateway
# ========================================
enzona.client-id=${ENZONA_CLIENT_ID:}
enzona.client-secret=${ENZONA_CLIENT_SECRET:}
enzona.merchant-uuid=${ENZONA_MERCHANT_UUID:}
enzona.base-url=https://api.enzona.net
enzona.token-url=https://api.enzona.net/token
enzona.qr-base-path=/qr/v1.0.0
enzona.currency=CUP
enzona.qr-timeout-hours=24
enzona.notify-url=${ENZONA_NOTIFY_URL:}
enzona.return-url=${ENZONA_RETURN_URL:}