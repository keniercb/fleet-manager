# ========================================
# Fleet Management - Configuracion de la aplicacion
# ========================================

# Perfil activo
spring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=fleet-management

# ========================================
# Servidor
# ========================================
server.port=8080

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# Logging
# ========================================
logging.level.com.fleet.management=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# JWT
# ========================================
jwt.secret=5A7B3C9D2E1F4A6B8C0D3E5F7A9B1C3D5E7F9A1B3C5D7E9F1A3B5C7D9E1F3A5B
jwt.expiration=86400000