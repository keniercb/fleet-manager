<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: landscape; margin: 20mm 15mm 25mm 15mm; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #333; margin: 0; padding: 0; }
        .report-title { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 10px; color: #1a1a2e; }
        .header { border: 1px solid #4a6fa5; border-radius: 4px; padding: 10px 15px; margin-bottom: 15px; background-color: #f0f4f8; }
        .header-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .header-row:last-child { margin-bottom: 0; }
        .header-label { font-weight: bold; color: #4a6fa5; min-width: 120px; }
        .header-value { flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        thead th { background-color: #4a6fa5; color: #ffffff; padding: 6px 8px; text-align: left; font-size: 8pt; }
        tbody td { padding: 4px 8px; border-bottom: 1px solid #e0e0e0; font-size: 8pt; }
        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        .text-center { text-align: center; }
        .total-row { margin-top: 15px; font-weight: bold; color: #4a6fa5; text-align: right; }
        .footer { position: running(footer); text-align: center; font-size: 7pt; color: #999; border-top: 1px solid #e0e0e0; padding-top: 5px; }
    </style>
</head>
<body>

    <div class="report-title">Listado de Choferes</div>

    <div class="header">
        <div class="header-row">
            <span class="header-label">Empresa:</span>
            <span class="header-value" th:text="${empresa.codigo + ' - ' + empresa.nombre}">-</span>
        </div>
        <div class="header-row">
            <span class="header-label">Email:</span>
            <span class="header-value" th:text="${empresa.email}">-</span>
        </div>
        <div class="header-row">
            <span class="header-label">Ubicación:</span>
            <span class="header-value" th:text="${empresa.provincia + ' / ' + empresa.municipio}">-</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="text-center" style="width: 30px;">#</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Carné de Identidad</th>
                <th>Número de Licencia</th>
                <th>Fecha Nacimiento</th>
                <th>Categorías de Licencia</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="chofer, iterStat : ${choferes}">
                <td class="text-center" th:text="${iterStat.count}">1</td>
                <td th:text="${chofer.nombre}">-</td>
                <td th:text="${chofer.apellidos}">-</td>
                <td th:text="${chofer.carneIdentidad}">-</td>
                <td th:text="${chofer.numeroLicencia}">-</td>
                <td th:text="${chofer.fechaNacimiento}">-</td>
                <td th:text="${chofer.categorias}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(choferes)}">
                <td colspan="7" class="text-center" style="padding: 20px; color: #999;">
                    No se encontraron choferes activos para esta empresa.
                </td>
            </tr>
        </tbody>
    </table>

    <div class="total-row" th:if="${!#lists.isEmpty(choferes)}">
        Total choferes: <span th:text="${totalChoferes}">0</span>
    </div>

    <div class="footer">
        Fecha de impresión: <span th:text="${fechaImpresion}">-</span>
    </div>

</body>
</html>
