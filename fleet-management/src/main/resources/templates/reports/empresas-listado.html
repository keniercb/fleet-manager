<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: landscape; margin: 20mm 15mm 25mm 15mm; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #333; margin: 0; padding: 0; }
        .report-title { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 15px; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        thead th { background-color: #4a6fa5; color: #ffffff; padding: 6px 8px; text-align: left; font-size: 8pt; }
        tbody td { padding: 4px 8px; border-bottom: 1px solid #e0e0e0; font-size: 8pt; }
        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        .text-center { text-align: center; }
        .total-row { margin-top: 15px; font-weight: bold; color: #4a6fa5; text-align: right; }
        .footer { position: running(footer); text-align: center; font-size: 7pt; color: #999; border-top: 1px solid #e0e0e0; padding-top: 5px; }
    </style>
</head>
<body>

    <div class="report-title">Listado de Empresas</div>

    <table>
        <thead>
            <tr>
                <th class="text-center" style="width: 30px;">#</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Provincia</th>
                <th>Municipio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="empresa, iterStat : ${empresas}">
                <td class="text-center" th:text="${iterStat.count}">1</td>
                <td th:text="${empresa.codigo}">-</td>
                <td th:text="${empresa.nombre}">-</td>
                <td th:text="${empresa.direccion}">-</td>
                <td th:text="${empresa.telefono}">-</td>
                <td th:text="${empresa.email}">-</td>
                <td th:text="${empresa.provincia}">-</td>
                <td th:text="${empresa.municipio}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(empresas)}">
                <td colspan="8" class="text-center" style="padding: 20px; color: #999;">
                    No se encontraron empresas activas.
                </td>
            </tr>
        </tbody>
    </table>

    <div class="total-row" th:if="${!#lists.isEmpty(empresas)}">
        Total empresas: <span th:text="${totalEmpresas}">0</span>
    </div>

    <div class="footer">
        Fecha de impresión: <span th:text="${fechaImpresion}">-</span>
    </div>

</body>
</html>
