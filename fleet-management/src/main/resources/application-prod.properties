# ========================================
# Perfil de Produccion - PostgreSQL
# ========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fleet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cambiar_password}

# Dialecto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desactivar consola H2 en produccion
spring.h2.console.enabled=false

# Logging reducido en produccion
logging.level.com.fleet.management=INFO
logging.level.org.hibernate.SQL=WARN

# ========================================
# FX-07: Secretos obligatorios en produccion
# ========================================
# En prod NO hay valor por defecto: si la variable de entorno no esta definida,
# la aplicacion NO arrancara (fail-fast).
jwt.secret=${JWT_SECRET}
fleet.subscription.default-admin-password=${FLEET_DEFAULT_ADMIN_PASSWORD}

# Enzona: obligatorios en prod si el modulo de pagos esta activo
enzona.client-id=${ENZONA_CLIENT_ID:}
enzona.client-secret=${ENZONA_CLIENT_SECRET:}
enzona.merchant-uuid=${ENZONA_MERCHANT_UUID:}

# FX-03: En prod, webhook debe estar protegido por firma HMAC + IP whitelist
enzona.allowed-ips=${ENZONA_ALLOWED_IPS:}
enzona.webhook-secret=${ENZONA_WEBHOOK_SECRET:}

# ========================================
# CORS - Orígenes permitidos en producción
# ========================================
# Variable de entorno obligatoria: CORS_ALLOWED_ORIGINS
# Lista separada por comas de los orígenes del frontend habilitados.
# Ej: https://fleet.midominio.cu,https://admin.midominio.cu
fleet.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
