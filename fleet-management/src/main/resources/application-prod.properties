# ========================================
# Perfil de Produccion - PostgreSQL
# ========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/fleetdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=fleet_user
spring.datasource.password=cambiar_password

# Dialecto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desactivar consola H2 en produccion
spring.h2.console.enabled=false

# Logging reducido en produccion
logging.level.com.fleet.management=INFO
logging.level.org.hibernate.SQL=WARN