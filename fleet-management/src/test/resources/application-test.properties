# ========================================
# Perfil de Test - Testcontainers Postgres
# ========================================

spring.profiles.active=test
spring.application.name=fleet-management-test
server.port=0

# JPA: ddl-auto=create-drop (esquema limpio por ejecucion de tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging reducido
logging.level.com.fleet.management=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

# JWT
jwt.secret=test-secret-DO-NOT-USE-IN-PROD-5A7B3C9D2E1F4A6B8C0D3E5F7A9B1C3D
jwt.expiration=86400000
jwt.audience=fleet-management-web

# Rate limit: desactivado en tests (max 1000 intentos)
fleet.security.rate-limit.max-attempts=1000
fleet.security.rate-limit.window-seconds=60
fleet.security.rate-limit.trust-forwarded-for=false

# Enzona: URLs seran sobreescritas por @DynamicPropertySource apuntando a WireMock
enzona.currency=CUP
enzona.qr-timeout-hours=24

# ShedLock desactivado en tests (no hay multi-instancia)
spring.shedlock.enabled=false
